name: build
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode with Swift 6
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          swift --version
      - name: swift test
        run: swift test --package-path native
      - name: Universal app build
        run: ./native/build.sh
